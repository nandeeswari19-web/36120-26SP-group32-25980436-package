[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: package names on (Test)PyPI are global - if "nba-draft-features" is taken, rename this
# and the src/nba_draft_features folder to something more unique, e.g. "nba-draft-features-25980436".
name = "nba-draft-features"
version = "0.3.0"
description = "College-to-NBA feature engineering and data-cleaning utilities for predicting sustained NBA careers (36120 AT1, student 25980436)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Student 25980436" }
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/<your-github-username>/36120-26SP-group32-25980436-package"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nba_draft_features"]
